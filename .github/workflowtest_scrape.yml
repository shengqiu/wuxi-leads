name: 测试-能否抓取无锡环评公示

on:
  workflow_dispatch:   # 手动触发

jobs:
  test-connectivity:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 安装依赖
        run: pip install requests beautifulsoup4

      - name: 测试1：能否拿到公示列表
        run: |
          python3 - << 'PYEOF'
          import requests
          from bs4 import BeautifulSoup

          URL = "https://bigdata.wuxi.gov.cn/gggs/jsxmhpspgszl/ffsjsxmhpspgs/slgs/index.shtml"
          headers = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"}

          print(f"正在请求: {URL}")
          r = requests.get(URL, headers=headers, timeout=20)
          print(f"HTTP 状态码: {r.status_code}")
          print(f"响应大小: {len(r.content)} bytes")

          soup = BeautifulSoup(r.text, "html.parser")
          items = soup.select("ul.list03 li a")
          print(f"\n找到公示条目: {len(items)} 条")
          for item in items[:5]:
              print(f"  - {item.get_text(strip=True)[:60]}")
          PYEOF

      - name: 测试2：能否访问详情页并找到 PDF 链接
        run: |
          python3 - << 'PYEOF'
          import requests
          from bs4 import BeautifulSoup

          # 用列表第一条的链接
          LIST_URL = "https://bigdata.wuxi.gov.cn/gggs/jsxmhpspgszl/ffsjsxmhpspgs/slgs/index.shtml"
          BASE = "https://bigdata.wuxi.gov.cn"
          headers = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"}

          r = requests.get(LIST_URL, headers=headers, timeout=20)
          soup = BeautifulSoup(r.text, "html.parser")
          first_link = soup.select_one("ul.list03 li a")
          detail_url = BASE + first_link["href"] if first_link["href"].startswith("/") else first_link["href"]
          print(f"详情页: {detail_url}")

          r2 = requests.get(detail_url, headers=headers, timeout=20)
          print(f"详情页状态码: {r2.status_code}")

          soup2 = BeautifulSoup(r2.text, "html.parser")
          pdfs = [a["href"] for a in soup2.find_all("a", href=True) if ".pdf" in a["href"].lower()]
          print(f"找到 PDF 链接: {len(pdfs)} 个")
          for p in pdfs[:3]:
              url = BASE + p if p.startswith("/") else p
              print(f"  - {url}")
          PYEOF

      - name: 测试3：能否下载 PDF（只取前 50KB 验证可达性）
        run: |
          python3 - << 'PYEOF'
          import requests
          from bs4 import BeautifulSoup

          BASE = "https://bigdata.wuxi.gov.cn"
          LIST_URL = BASE + "/gggs/jsxmhpspgszl/ffsjsxmhpspgs/slgs/index.shtml"
          headers = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"}

          r = requests.get(LIST_URL, headers=headers, timeout=20)
          soup = BeautifulSoup(r.text, "html.parser")
          first_link = soup.select_one("ul.list03 li a")
          detail_url = BASE + first_link["href"]

          r2 = requests.get(detail_url, headers=headers, timeout=20)
          soup2 = BeautifulSoup(r2.text, "html.parser")
          pdfs = [a["href"] for a in soup2.find_all("a", href=True) if ".pdf" in a["href"].lower()]

          if pdfs:
              pdf_url = BASE + pdfs[0] if pdfs[0].startswith("/") else pdfs[0]
              print(f"测试 PDF: {pdf_url}")
              r3 = requests.get(pdf_url, headers=headers, timeout=30, stream=True)
              print(f"PDF 状态码: {r3.status_code}")
              chunk = next(r3.iter_content(1024*50))  # 只下 50KB
              print(f"前50KB头部: {chunk[:8]}")  # %PDF-1.x
              print(f"✅ PDF 可下载" if chunk[:4] == b'%PDF' else "❌ 不是有效PDF")
          PYEOF

      - name: 测试4：OCR 能力（仅在 GitHub Actions 环境验证）
        run: |
          sudo apt-get install -y -qq poppler
