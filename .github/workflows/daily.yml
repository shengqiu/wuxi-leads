name: 每日线索报告

on:
  schedule:
    # 每天 00:00 UTC = 北京时间 08:00
    - cron: '0 0 * * *'
  workflow_dispatch:   # 允许手动触发

jobs:
  generate-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 安装中文字体（文泉驿正黑）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-wqy-zenhei
          fc-list :lang=zh | head -5

      - name: 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 生成 PDF 并推送企业微信
        env:
          WXWORK_WEBHOOK_KEY: ${{ secrets.WXWORK_WEBHOOK_KEY }}
          OUTPUT_DIR: /tmp
        run: python gen_leads.py

      - name: 上传 PDF（可选，保留7天）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leads-pdf-${{ github.run_id }}
          path: /tmp/*.pdf
          retention-days: 7
