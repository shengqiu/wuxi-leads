name: 每日线索报告

on:
  schedule:
    # 每天 00:00 UTC = 北京时间 08:00
    - cron: '0 0 * * *'
  workflow_dispatch:   # 允许手动触发

jobs:
  generate-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 安装系统依赖（字体 + OCR + PDF解析）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            fonts-wqy-zenhei \
            tesseract-ocr \
            tesseract-ocr-chi-sim \
            poppler-utils
          echo "字体：$(fc-list :lang=zh | wc -l) 个"
          echo "Tesseract：$(tesseract --version 2>&1 | head -1)"
          echo "pdftoppm：$(pdftoppm -v 2>&1 | head -1)"

      - name: 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 安装 Python 依赖
        run: pip install -r requirements.txt

      - name: 抓取环评公示并推送企业微信
        env:
          WXWORK_WEBHOOK_KEY: ${{ secrets.WXWORK_WEBHOOK_KEY }}
          OUTPUT_DIR: /tmp
          PYTHONIOENCODING: utf-8
        run: python scrape_leads.py

      - name: 上传 PDF（保留7天）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leads-pdf-${{ github.run_id }}
          path: /tmp/*.pdf
          retention-days: 7
